<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artizia Catalogue — Premium Engineered Quartz Surfaces</title>
<meta name="description" content="Browse the full Artizia catalogue — 53 engineered quartz designs across five collections, jumbo 3300 × 1650 mm slabs, pressed on Breton Stone technology in Jaipur, India.">
<link rel="canonical" href="https://artizia.co.in/catalogue">
<!-- What WhatsApp, LinkedIn and mail clients show when this link is shared.
     Crawlers do not run JavaScript, so these have to be here, static, with
     absolute URLs. The cover is written by the server from page 1 of the PDF
     and keeps the same name across re-uploads. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Artizia">
<meta property="og:url" content="https://artizia.co.in/catalogue">
<meta property="og:title" content="Artizia Catalogue — Premium Engineered Quartz Surfaces">
<meta property="og:description" content="53 engineered quartz designs across five collections. Jumbo 3300 × 1650 mm slabs, pressed on Breton Stone technology in Jaipur.">
<meta property="og:image" content="https://artizia.co.in/uploads/catalogue-cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Artizia Catalogue — Premium Engineered Quartz Surfaces">
<meta name="twitter:description" content="53 engineered quartz designs across five collections. Jumbo 3300 × 1650 mm slabs, pressed on Breton Stone technology in Jaipur.">
<meta name="twitter:image" content="https://artizia.co.in/uploads/catalogue-cover.jpg">
<link rel="icon" type="image/png" href="assets/img/brand/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .cat-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:clamp(18px,2.4vw,28px)}
  .cat-actions .spacer{flex:1 1 auto}
  .cat-facts{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}

  /* the PDF, inline. Height follows the viewport so the reader gets a real
     page in view rather than a letterbox. */
  /* A portrait frame proportioned like an A4 sheet plus the viewer's toolbar,
     sized to the viewport so one whole page sits in view; the viewer is asked
     to fit the page (view=Fit for Chrome/Edge, zoom=page-fit for Firefox). */
  .cat-frame{--h:max(640px,calc(100vh - 170px));height:var(--h);
    width:min(100%,calc((var(--h) - 56px) / 1.414 + 48px));margin:0 auto;
    border:1px solid var(--line);border-radius:14px;background:var(--surface);display:block}

  /* phones and tablets cannot scroll a PDF inside an iframe (iOS renders only
     page 1), so they get the cover and a button that opens it natively */
  .cat-mobile{display:none;max-width:520px;margin:0 auto;text-align:center}
  .cat-mobile .cover{width:100%;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);
    box-shadow:0 24px 60px rgba(0,0,0,.28)}
  .cat-mobile .cover img{width:100%;height:auto;display:block}
  .cat-mobile .btns{display:flex;flex-direction:column;gap:12px;margin-top:22px}
  .cat-mobile .btn{justify-content:center}
  body.cat-touch .cat-actions,body.cat-touch .cat-frame{display:none}
  body.cat-touch .cat-mobile{display:block}
  .cat-mobile .cat-facts{display:block;margin-top:16px}

  .cat-empty{padding:clamp(40px,6vw,80px) 20px;text-align:center;color:var(--text-dim);border:1px dashed var(--line-2);border-radius:14px}
  /* these classes set their own display, which would otherwise beat the hidden attribute */
  .cat-actions[hidden],.cat-frame[hidden],.cat-mobile[hidden],.cat-empty[hidden]{display:none!important}
</style>
</head>
<body data-page="catalogue">

<!--
═══════════════════════════════════════════════════════════════════════
  CATALOGUE PAGE — EDIT EVERYTHING HERE
═══════════════════════════════════════════════════════════════════════
  The file itself is uploaded in the admin panel (Catalogue tab); this page
  always shows whatever is current. Share  https://artizia.co.in/catalogue
═══════════════════════════════════════════════════════════════════════
-->
<script>
window.PAGE = {
  banner: {
    image:    "",
    alt:      "Artizia quartz surface",
    fallback: "calacatta-gold",
    zoom:     1.3,
    eyebrow:  "The Collection",
    title:    "The Artizia <em>catalogue.</em>",
    lead:     "Every design, every collection, every specification — in one place."
  },
  labels: {
    open:     "Open in a new tab",
    download: "Download PDF",
    samples:  "Request Samples",
    openMob:  "Open the Catalogue",
    empty:    "The catalogue is being updated — please check back shortly."
  },
  cta: {
    eyebrow: "Seen something you like?",
    title:   "Let's put it <em>in your project.</em>",
    text:    "Free samples shipped across India in 5–7 days. Quotes for projects of any size."
  }
};
</script>

<section class="page-hero">
  <div class="ph-vis"></div>
  <div class="wrap">
    <span class="eyebrow"></span>
    <h1></h1>
    <p class="lead"></p>
  </div>
</section>

<section class="pad" style="padding-top:clamp(20px,4vw,50px)"><div class="wrap">
  <div class="cat-actions rv" id="catActions" hidden>
    <a class="btn btn-fill mag" id="catOpen" target="_blank" rel="noopener"><span><span id="lblOpen"></span> <span class="arw">→</span></span></a>
    <a class="btn btn-line mag" id="catDownload" download><span id="lblDownload"></span></a>
    <a class="btn btn-line mag" href="#" id="catSamples"><span id="lblSamples"></span></a>
    <span class="spacer"></span>
    <span class="cat-facts" id="catFacts"></span>
  </div>

  <iframe class="cat-frame rv d1" id="catFrame" title="Artizia catalogue" hidden></iframe>

  <div class="cat-mobile rv d1" id="catMobile">
    <div class="cover" id="catCover" hidden><img id="catCoverImg" alt="Artizia catalogue cover"></div>
    <div class="btns">
      <a class="btn btn-fill mag" id="catOpenMob" target="_blank" rel="noopener"><span><span id="lblOpenMob"></span> <span class="arw">→</span></span></a>
      <a class="btn btn-line mag" id="catDownloadMob" download><span id="lblDownloadMob"></span></a>
      <a class="btn btn-line mag" href="#" id="catSamplesMob"><span id="lblSamplesMob"></span></a>
    </div>
    <span class="cat-facts" id="catFactsMob"></span>
  </div>

  <div class="cat-empty rv" id="catEmpty" hidden></div>
</div></section>

<section class="cta pad"><div class="wrap rv">
  <span class="eyebrow center" id="ctaEye"></span>
  <h2 style="margin-top:22px" id="ctaTitle"></h2>
  <p id="ctaText"></p>
  <div class="row">
    <a class="btn btn-fill mag" href="contact.html"><span>Contact Us <span class="arw">→</span></span></a>
    <a class="btn btn-line mag" href="become-a-dealer.html"><span>Become a Dealer</span></a>
  </div>
</div></section>

<script src="assets/js/data.js"></script>
<script src="assets/js/marble.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function(){
  const P=window.PAGE,L=P.labels||{},$=id=>document.getElementById(id);
  const mb=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';

  $('ctaEye').textContent=P.cta.eyebrow; $('ctaTitle').innerHTML=P.cta.title; $('ctaText').textContent=P.cta.text;
  $('lblOpen').textContent=L.open; $('lblDownload').textContent=L.download; $('lblSamples').textContent=L.samples;
  $('lblOpenMob').textContent=L.openMob; $('lblSamplesMob').textContent=L.samples; $('lblDownloadMob').textContent=L.download;
  for(const id of ['catSamples','catSamplesMob']) $(id).addEventListener('click',e=>{e.preventDefault();window.openTray();});

  /* any touch device, whatever its size: no inline reader — the cover, and a
     button that hands the file to the device's own viewer. iPads report a coarse
     pointer even in landscape at 1366px, where the frame would show page 1 only. */
  const touch=matchMedia('(pointer:coarse)').matches||matchMedia('(max-width:820px)').matches;
  if(touch) document.body.classList.add('cat-touch');

  fetch('/api/catalogue').then(r=>r.ok?r.json():null).then(c=>{
    if(!c||!c.configured||!c.url) return showEmpty();
    const url=c.url;
    $('catOpen').href=url; $('catOpenMob').href=url;
    for(const id of ['catDownload','catDownloadMob']){ $(id).href=url; $(id).setAttribute('download',c.name||'artizia-catalogue'); }
    $('catFacts').textContent=[c.type==='pdf'?'PDF':'Image', mb(c.size||0),
      c.updatedAt?'updated '+new Date(c.updatedAt).toLocaleDateString('en-IN',{month:'short',year:'numeric'}):''].filter(Boolean).join(' · ');
    $('catFactsMob').textContent=$('catFacts').textContent;
    $('catActions').hidden=false;

    if(c.cover){ $('catCoverImg').src=c.cover+'?v='+(Date.parse(c.updatedAt)||0); $('catCover').hidden=false; }

    if(!touch){
      /* an image catalogue has no pages to page through — show it directly */
      if(c.type==='pdf'){ $('catFrame').src=url+'#view=Fit&zoom=page-fit&navpanes=0'; $('catFrame').hidden=false; }
      else { const img=document.createElement('img'); img.src=url; img.alt='Artizia catalogue';
             img.style.cssText='width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:14px';
             $('catFrame').replaceWith(img); }
    }
    window.Artizia.refresh();
  }).catch(showEmpty);
  function showEmpty(){
    $('catEmpty').textContent=L.empty; $('catEmpty').hidden=false;
    for(const id of ['catActions','catFrame','catMobile']) $(id).hidden=true;
  }

  window.Artizia.refresh();
})();
</script>
<script src="assets/js/pageedit.js"></script>
</body>
</html>
